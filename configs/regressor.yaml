regressor:
  model:
    in_channels: 1
    n_params: 6               # [θ_E, e1, e2, γ1, γ2, M_sub]
    dropout: 0.2

  training:
    epochs: 100
    batch_size: 64
    learning_rate: 1.0e-4
    weight_decay: 1.0e-4
    grad_clip: 1.0

  loss:
    type: huber
    delta: 0.1

  scheduler:
    type: reduce_on_plateau
    patience: 10
    factor: 0.5
    min_lr: 1.0e-7

  expected_metrics:
    einstein_radius_rmse: 0.07   # arcsec
    ellipticity_rmse: 0.03

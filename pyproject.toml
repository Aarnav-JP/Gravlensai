[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravlensai"
version = "0.1.0"
description = "Deep learning pipeline for gravitational lens detection and parameter estimation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "GravLensAI Contributors" }
]
dependencies = [
  "torch",
  "torchvision",
  "timm",
  "numpy",
  "scipy",
  "astropy",
  "astroquery",
  "galsim",
  "lenstronomy",
  "matplotlib",
  "scikit-learn",
  "scikit-image",
  "pandas",
  "pyyaml",
  "tqdm",
  "tensorboard",
  "opencv-python-headless",
  "joblib",
  "xgboost",
  "gradio"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.11.0",
  "ruff>=0.6.0",
  "build>=1.2.1",
  "twine>=5.1.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["gravlensai*"]

[tool.setuptools.dynamic]
# Explicitly list all subpackages to ensure editable install works
version = {attr = "gravlensai.__version__"}

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["venv", ".venv", "build", "dist"]

[[tool.mypy.overrides]]
module = "tifffile.*"
ignore_errors = true

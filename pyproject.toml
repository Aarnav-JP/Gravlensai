[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravlensai"
version = "0.1.0"
description = "Deep learning pipeline for gravitational lens detection and parameter estimation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "GravLensAI Contributors" }
]
dependencies = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "timm>=1.0.0",
  "numpy>=1.26.0,<2.0.0",
  "scipy>=1.12.0",
  "astropy>=6.0.0",
  "astroquery>=0.4.7",
  "galsim>=2.5.0",
  "lenstronomy>=1.11.0",
  "matplotlib>=3.8.0",
  "scikit-learn>=1.4.0",
  "scikit-image>=0.22.0",
  "pandas>=2.2.0",
  "pyyaml>=6.0.1",
  "tqdm>=4.66.0",
  "tensorboard>=2.16.0",
  "opencv-python-headless>=4.9.0",
  "joblib>=1.4.0",
  "xgboost>=2.0.0",
  "gradio>=5.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.11.0",
  "ruff>=0.6.0",
  "build>=1.2.1",
  "twine>=5.1.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["gravlensai*"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
